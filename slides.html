ng việc", "body": "<div class=\"cover-meta\">NL ⇒ Schedule · MANS</div><p class=\"big\">Chuyển mô tả ngôn ngữ tự nhiên thành lịch thực hiện có ràng buộc tài nguyên</p><div class=\"cover-line\">Wenrui Liao · Weihong Du · Yi Li · Hongru Liang · Wenqiang Lei<br>ACL 2026 — Long Papers</div>", "note": "Hôm nay em trình bày ứng dụng AI Agent trong pha lập kế hoạch, tập trung vào lập lịch công việc. Nguồn chính là bài NL ⇒ Schedule tại ACL 2026. Bài đề xuất MANS, một quy trình bốn tác tử, cùng bộ dữ liệu và mã nguồn. Em sẽ giải thích cơ chế, phân tích kết quả rồi minh họa bằng một ví dụ nhỏ. Phạm vi là lập lịch, không phải toàn bộ quản lý dự án hay hệ thống phân tích rủi ro.", "source": "Trang đầu, tóm tắt", "page": 1}, {"title": "Bài toán lập lịch từ mô tả công việc", "body": "<div class=\"visual-layout\"><figure><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAxIAAAKVCAIAAADUZEpIAAAACXBIWXMAAA7EAAAOxAGVKw4bAAGZJElEQVR4nOydB3hURdeAQeSnCShdAWmKioig6IeoSLFiAynSpPfeBVGQjtJ77y1A6E0glISW3nvvm2RTN73/792BdUk2cRMCEZnDPDyb3XvPnDkzd847c+fOLZOrJzk5OYGBAXfNr/ra30oJcU0Pcc0Mc5dJJplkkkkmmWR6ehL8kxjo4nLnutVtC3VUlD4pldF9StRorG+bh7tZSVqSSSaZZJJJJplkSgt29bO/5Whnk5GR8QA2JSZqbG5eSwlyKXUTZZJJJplkkkkmmf49SRPgZHXLQpCTgk3p6enWN6+nBDqXumUyySSTTDLJJJNM/7ak8Xeyt7G+h00ebq4JPvalbpNMMskkk0wyySTTvzP52d9SR0Up2GR/+1qpWyOTTDLJJJNMMsn0r02pwa42d2+XUavVAQ63S90amWSSSSaZZJJJpn9zcrO+WcbdzTXay7bUTZFJJplkkkkmmWT6N6fkILcyttZWsd52pW6KTDLJJJNMMskk0785pYe4lbG2vBsjZ5tkkkkmmWSSSSaZ/ilJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKpUMNiX6O0R7Wkd7Wskkk0xPW4r1skkPcS31vsz4lBHqFu9jV+p+k0kmmUolcfnTCZQyNm3+c/4XnT7+slMHmWSS6alKXPg/ft/V3+ZqqcOQ8SnBx27WhJGyy5JJpqcwceFPGTWEwV4pY9OUUYP79u17UYoUKU+ZmJqavtqsifONs6UOQ8anGE/rbz/v/Ouvv5a286RIkfK4ZdGiRV906hDldrf0sYk+KFeKFClPmcTHx7d4 ài báo có ba câu hỏi. Thứ nhất, khả năng lập lịch trực tiếp của các LLM hiện có. Thứ hai, phân tích lỗi thay vì chỉ nhìn một điểm số tổng. Thứ ba, thiết kế quy trình đa tác tử để cải thiện. Nghiên cứu không đặt mục tiêu tự động hóa toàn bộ SDLC; điều này phù hợp với hướng thu hẹp đề tài vào một pha cụ thể.", "source": "Mục 1, 4", "page": 2}, {"title": "Các ràng buộc của một lịch hợp lệ", "body": "<div class=\"cols\"><section><h3>Thứ tự công đoạn</h3><div class=\"mini\">Cắt A → Sơn A<br>Cắt B → Sơn B</div><p>Mỗi bước chỉ bắt đầu khi bước trước đã kết thúc.</p></section><section><h3>Năng lực tài nguyên</h3><div class=\"mini\">Máy cắt: tối đa 1 việc<br>Máy sơn: tối đa 1 việc</div><p>Các bước dùng chung máy không được chồng thời gian.</p></section><section><h3>Thời lượng và mục tiêu</h3><div class=\"mini\">Kết thúc − bắt đầu<br>= thời lượng yêu cầu</div><p>Giảm makespan: thời điểm hoàn thành bước cuối cùng.</p></section></div>", "note": "Ta cần nắm ba yếu tố để hiểu các slide sau. Một là phụ thuộc giữa công đoạn. Hai là năng lực của tài nguyên; trong ví dụ, mỗi máy chỉ làm một việc tại một thời điểm. Ba là thời lượng phải đúng. Khi đã hợp lệ, ta mới xét chất lượng lịch qua makespan. Lịch ngắn nhưng vi phạm ràng buộc không phải phương án chấp nhận được.", "source": "Mục 3; ví dụ minh họa", "page": 3}, {"title": "MANS: bốn agent, bốn nhiệm vụ", "body": "<div class=\"visual-layout architecture\"><figure><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2oAAAKZCAIAAABGOE9fAAAACXBIWXMAAA7EAAAOxAGVKw4bAAShjUlEQVR4nOydB1gVSaK2JeckWXIwIYooCKiAEkSMmBMmEAEVwYA5B8w5JxQDUQUM5JxzzqII6ISdmXt3Z2fnzv67O/t/5xT0nDkEAREQqp/38cE6Haqrq6ve6q6qHvTfz1j++c9//vjjj/X19VVV5Tm5GbW15d99//bjtzWNH6vqGysbPlQ0fqykUCgUCoVCofQw0LCGD5Ufvqn+5rs33/2lrrgkNzcvq6am+uPHj3/961//85//fI4BDuraZj/99FNJSVFObmbd+yrEjJoihUKhUCgUSh+n/kPlN9/WllcWFRTnQSX/7//+r4f08ccffywszMvOSalvrKDWSKFQKBQKhfI1Ul6Rl5efWVFR3gWJ7IQ+/uMf/ygpKcTB3r0vpeJIoVAoFAqF8lUDnXtTW1xeXlBX965Tr7M7pI8Qx+rqyrd15fWN5b1+qhQKhUKhUCiU7gISWf+hsqKipLGxoYM aI0WIBAAAAHiqFJeWFfIFN0Siwurq6pZGQVPiY3356af/SCRFefnZhcI8lVqq1MZYfK8NAAAA8MTRhjRNiUojy875MZ+fK5OV1dTUmBwCTY+P+lJbW/vLL79oNBqFQq7WVPz0k/rmv2VqTQkmrQEAAABgilJVpFQVq29Kb91W/PfOrfIKuUKhqKqqotRYV1fXyvj3P5+Z+UCo5SzDAAAAAElFTkSuQmCC\" alt=\"Hình 5 gốc: Seeker, Weaver, Verifier và Architect phối hợp trong MANS\"><figcaption>Hình 5 · Kiến trúc MANS nguyên bản</figcaption></figure><section class=\"role-legend\"><div><b>01 · Seeker</b><p>Đủ nhiệm vụ, đúng số lượng</p></div><div><b>02 · Weaver</b><p>Đủ bước, máy và thời lượng</p></div><div><b>03 · Verifier</b><p>Đối chiếu và sửa dữ liệu</p></div><div><b>04 · Architect</b><p>Lập lịch từ bản đã kiểm tra</p></div></section></div>", "note": "Bốn agent ở đây là bốn vai trò được gọi tuần tự, không nhất thiết là bốn mô hình độc lập hay bốn bot chạy song song. Seeker khoanh đúng phạm vi. Weaver làm rõ từng công đoạn. Verifier kiểm tra cấu trúc đó với văn bản gốc. Architect nhận cấu trúc đã kiểm tra để lập lịch. Phân vai giúp giảm khối lượng suy luận của mỗi lượt gọi.", "source": "Mục 4.3.1, Hình 5", "page": 7}, {"title": "Seeker và Weaver: trích xuất đúng công việc", "body": "<div class=\"cols\"><section><h3>Seeker · không bỏ sót nhiệm vụ</h3><blockquote>Sản phẩm A và B</blockquote><p>Ghi nhận đúng số lượng và từng nhiệm vụ phải hoàn thành.</p></section><section><h3>Weaver · làm rõ từng công đoạn</h3><table><thead><tr><th>Việc</th><th>Bước 1</th><th>Bước 2</th></tr></thead><tbody><tr><td>A</td><td>Cắt · 3 phút</td><td>Sơn · 2 phút</td></tr><tr><td>B</td><td>Cắt · 2 phút</td><td>Sơn · 4 phút</td></tr></tbody></table></section></div>", "note": "Seeker chỉ tập trung xác định nhiệm vụ, tránh bị phân tán bởi các chi tiết máy và thời gian. Weaver tiếp tục bóc tách mỗi nhiệm vụ thành các bước. Ví dụ A cần cắt ba phút rồi sơn hai phút; B cần cắt hai phút rồi sơn bốn phút. Bảng này là dữ liệu có cấu trúc, chưa phải lịch vì chưa có thời điểm bắt đầu.", "source": "Mục 4.3.1; ví dụ do nhóm xây dựng", "page": 7}, {"title": "Verifier: kiểm tra trước khi lập lịch", "body": "<div class=\"split\"><div><p class=\"big\">Văn bản gốc là căn cứ kiểm tra.</p><ul><li>Đã đủ nhiệm vụ và số lần thực hiện?</li><li>Đã đủ bước và đúng thứ tự?</li><li>Máy và thời lượng có khớp mô tả?</li></ul></div><div class=\"audit\"><span>DỮ LIỆU BỊ SAI</span><h3>B · Sơn · 3 phút</h3><div class=\"arrow\">↓ đối chiếu yêu cầu ↓</div><span>DỮ LIỆU ĐÃ SỬA</span><h3>B · Sơn · 4 phút</h3></div></div>", "note": "Verifier không đơn giản là hỏi mô hình có chắc không. Vai trò này phải đối chiếu từng trường với đầu vào gốc. Ví dụ nếu Weaver đọc nhầm thời gian sơn B thành ba phút, Verifier cần sửa thành bốn. Đây là kiểm tra ngữ nghĩa bằng LLM, vẫn có thể sai. Sau khi Architect lập lịch, ta còn cần kiểm tra ràng buộc bằng chương trình.", "source": "Mục 4.3.1; lỗi giả định để minh họa", "page": 7}, {"title": "Architect: chọn thứ tự sử dụng tài nguyên", "body": "<p>Hai phương án đều đúng ràng buộc, nhưng thời gian hoàn thành khác nhau.</p><div id=\"example-gantts\"></div><div class=\"wide\">Ưu tiên B trên máy cắt giúp máy sơn xử lý công đoạn dài sớm hơn.</div>", "note": "Nếu làm A trước, máy cắt làm A từ 0 đến 3 rồi B từ 3 đến 5; máy sơn làm A từ 3 đến 5 rồi B từ 5 đến 9. Nếu B trước, B được sơn từ 2 đến 6, trong lúc A được cắt từ 2 đến 5; sau đó sơn A từ 6 đến 8. Makespan giảm từ chín xuống tám phút. Đây là ví dụ tính tay của nhóm, không phải số liệu thực nghiệm trong bài.", "source": "Ví dụ tính toán của nhóm; nguyên lý theo mục 3, 4.3.1", "page": 7}, {"title": "Bộ dữ liệu NL ⇒ Schedule", "body": "<div class=\"stats\"><div><strong>240</strong><span>trường hợp</span></div><div><strong>4</strong><span>bối cảnh</span></div><div><strong>5–10</strong><span>nhiệm vụ / trường hợp</span></div></div><figure class=\"dataset-figure\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABxcAAAEvCAIAAAAILdgAAAAACXBIWXMAAA7EAAAOxAGVKw4bAALn00lEQVR4nOy9BZccR5Y2PP9EZBlkSzLKlmW2DLLHklrcYmbmZmZmZmZmZuauahJLHo9nz7vv7nnn7Oye9cz3PZnReSsqC1TdttRtOXye49OqysyKjLhx4YkbN/70/ ols tạo lịch tối ưu tham chiếu. Không phải 240 dự án vận hành thực tế.</p>", "note": "Tác giả thu thập 135 nhiệm vụ cơ bản từ các nguồn công khai, rồi ghép thành 240 bài toán. Mỗi bối cảnh có mười trường hợp cho từng cỡ từ năm đến mười nhiệm vụ: bốn nhân mười nhân sáu bằng 240. OR-Tools cung cấp lịch tối ưu tham chiếu. Mô tả tự nhiên được tạo từ dữ liệu cấu trúc bằng pipeline data2text. Cần gọi đúng đây là dữ liệu bán tổng hợp.", "source": "Mục 3, Bảng 1", "page": 3}, {"title": "Thiết kế thực nghiệm và thước đo", "body": "<div class=\"experiment\"><section><span>Đánh giá trực tiếp</span><strong>9 LLM</strong><p>Văn bản → lịch</p></section><div class=\"exp-arrow\">→</div><section><span>Phân tích lỗi</span><strong>RQ1 / RQ2</strong><p>Đủ bước? Đúng thứ tự? Trùng máy?</p></section><div class=\"exp-arrow\">→</div><section><span>Cải thiện</span><strong>MANS</strong><p>So với 6 tổ hợp LLM + solver</p></section></div><div class=\"cols\"><section><h3>Hai nhóm so sánh</h3><p>So sánh chính dùng Gemini 2.5 Flash ở chế độ không thinking.</p></section><section><h3>Đánh giá từ đúng đến tốt</h3><table><thead><tr><th>Chỉ số</th><th>Ý nghĩa</th></tr></thead><tbody><tr><td>SER</td><td>Mức thực hiện đúng các bước</td></tr><tr><td>TCR</td><td>Tỷ lệ nhiệm vụ hoàn tất</td></tr><tr><td>SFR</td><td>Tỷ lệ lịch hoàn toàn khả thi</td></tr><tr><td>WRT / RMD</td><td>Thời gian tệ nhất / độ lệch makespan</td></tr></tbody></table></section></div>", "note": "SER đo mức thực hiện đúng các bước, TCR đo nhiệm vụ hoàn tất, còn SFR yêu cầu cả lịch đều khả thi. Vì thế SER cao không có nghĩa cả lịch dùng được. WRT đo thời gian chạy tệ nhất trong thiết lập thí nghiệm. RMD đo độ lệch makespan so với lịch tham chiếu, trên các lịch khả thi. Khi so sánh phải giữ đúng mô hình nền và quy mô bài toán.", "source": "Mục 4.1.1–4.1.2, 4.3.1", "page": 4}, {"title": "LLM trực tiếp vẫn khó tạo lịch khả thi", "body": "<p>SFR ở bài toán 5 nhiệm vụ · một số mô hình trong Bảng 2</p><div class=\"bars\"><div><span>GPT-4.1</span><div class=\"track\"><i style=\"width:5%\"></i></div><b>5%</b></div><div><span>Gemini 2.5 Flash · no thinking</span><div class=\"track\"><i style=\"width:20%\"></i></div><b>20%</b></div><div><span>o4-mini</span><div class=\"track\"><i style=\"width:32.5%\"></i></div><b>32.5%</b></div><div><span>Gemini 2.5 Pro</span><div class=\"track\"><i style=\"width:32.5%\"></i></div><b>32.5%</b></div></div><div class=\"wide\">Hiểu đúng văn bản chưa đủ để xử lý đồng thời mọi phụ thuộc và xung đột.</div>", "note": "Ở nhóm năm nhiệm vụ, GPT-4.1 có SFR năm phần trăm; Gemini Flash hai mươi phần trăm; o4-mini và Gemini Pro đều ba mươi hai phẩy năm phần trăm. Các con số là kết quả của bài báo với thiết lập lúc nghiên cứu, không phải đánh giá mọi phiên bản hiện tại. Điểm đáng chú ý là ngay mô hình mạnh vẫn có nhiều lịch không khả thi.", "source": "Bảng 2; chỉ trích nhóm #Task=5", "page": 5}, {"title": "Tốc độ và chất lượng lịch của MANS", "body": "<table><thead><tr><th>Phương pháp</th><th>WRT · giây ↓</th><th>RMD ↓</th></tr></thead><tbody><tr><td>CoE + MOPNR</td><td>128.42</td><td>0.192</td></tr><tr><td>CoE + OR-Tools</td><td>154.44</td><td>0.023</td></tr><tr><td>Optimus + OR-Tools</td><td>133.70</td><td>0.022</td></tr><tr><td>MANS</td><td>79.59</td><td>0.085</td></tr></tbody></table><div class=\"cols insight\"><section><h3>WRT thấp hơn</h3><p>MANS giảm khoảng 40,5% so với Optimus + OR-Tools.</p></section><section><h3>Chưa tốt nhất về makespan</h3><p>RMD 0.085 cao hơn 0.022 của Optimus + OR-Tools.</p></section></div>", "note": "Bảng bốn cho thấy một sự đánh đổi. MANS có WRT 79,59 giây, so với 133,70 của Optimus cộng OR-Tools, tương ứng giảm khoảng 40,5 phần trăm. Nhưng RMD của MANS là 0,085, cao hơn 0,022; lịch khả thi của nó lệch tối ưu nhiều hơn. Vì vậy không kết luận MANS thắng mọi mặt. Bảng trên chọn bốn hàng, không phải toàn bộ sáu baseline.", "source": "Bảng 4; phần trăm tính từ số liệu gốc", "page": 8}, {"title": "Mỗi vai trò có đóng góp riêng", "body": "<p>SFR khi bỏ từng agent · bài toán 5 nhiệm vụ, cùng thiết lập thí nghiệm</p><div class=\"bars\"><div><span>MANS đầy đủ</span><div class=\"track\"><i style=\"width:40%\"></i></div><b>40%</b></div><div><span>Bỏ Seeker</span><div class=\"track\"><i style=\"width:20%\"></i></div><b>20%</b></div><div><span>Bỏ Weaver</span><div class=\"track\"><i style=\"width:37.5%\"></i></div><b>37.5%</b></div><div><span>Bỏ Verifier</span><div class=\"track\"><i style=\"width:30%\"></i></div><b>30%</b></div></div><div class=\"wide\">Bỏ Seeker làm SFR giảm từ 40% xuống 20%; xác định đúng phạm vi là bước quan trọng.</div>", "note": "Ablation study là thí nghiệm bỏ từng thành phần để xem vai trò của nó. Với năm nhiệm vụ, MANS đầy đủ có SFR bốn mươi phần trăm. Bỏ Seeker còn hai mươi; bỏ Weaver còn ba mươi bảy phẩy năm; bỏ Verifier còn ba mươi. Điều này ủng hộ việc phân vai, nhưng SFR bốn mươi phần trăm cũng cho thấy hệ thống chưa đủ tin cậy để tự động dùng mọi đầu ra.", "source": "Bảng 5, mục 4.3.2", "page": 8}, {"title": "Giá trị và giới hạn của nghiên cứu", "body": "<div class=\"cols\"><section><h3>Đóng góp</h3><ul><li>Nối mô tả văn bản với lịch thực thi.</li><li>Benchmark có cấu trúc và lịch tham chiếu.</li><li>Quy trình bốn agent có mã nguồn công khai.</li></ul></section><section><h3>Giới hạn</h3><ul><li>Dữ liệu bán tổng hợp; quy mô 5–10 nhiệm vụ.</li><li>Chưa xét thời lượng ngẫu nhiên, tài nguyên biến động.</li><li>Lịch đầu ra vẫn có thể không khả thi.</li></ul></section></div>", "note": "Giá trị của bài là bài toán rõ, dữ liệu có chuẩn so sánh và mã nguồn để tiếp cận cơ chế. Tuy nhiên, bài chưa giải quyết các yếu tố thực tế như máy hỏng đột ngột hoặc thời lượng bất định. Vì vậy ta chỉ xem nó là nền cho trợ lý lập lịch, không tự gán thành hệ thống phân tích rủi ro toàn diện.", "source": "Mục 5–6; repository chính thức", "page": 9}, {"title": "Ứng dụng vào pha lập kế hoạch dự án", "body": "<div class=\"rows\"><section><b>01</b><div><h3>Chuẩn hóa đầu vào</h3><p>Mô tả công việc, phụ thuộc, tài nguyên và thời lượng rõ ràng.</p></div></section><section><b>02</b><div><h3>Đề xuất và kiểm tra lịch</h3><p>Agent lập phương án; chương trình kiểm tra xung đột; người quản lý xem xét.</p></div></section><section><b>03</b><div><h3>Mở rộng phân tích tình huống</h3><p>Thử tăng thời lượng hoặc giảm tài nguyên để quan sát tác động đến kế hoạch.</p></div></section></div>", "note": "Để áp dụng vào đề tài, nhóm ưu tiên một quy trình có dữ liệu đủ rõ và quy mô nhỏ. Kết quả cần được kiểm tra trước khi người quản lý quyết định. Phần phân tích tình huống tăng thời lượng là hướng mở rộng của nhóm, không phải đóng góp đã được kiểm chứng trong bài. Cũng không nên đồng nhất các xung đột lịch với toàn bộ rủi ro dự án.", "source": "Đề xuất áp dụng của nhóm; giới hạn gốc ở mục 6", "page": 9}, {"title": "Kết luận theo ba câu hỏi nghiên cứu", "body": "<div class=\"rows\"><section><b>RQ1</b><div><h3>LLM chưa lập lịch đủ tin cậy</h3><p>SFR thấp ngay ở bài toán nhỏ; cần đánh giá khả thi rõ ràng.</p></div></section><section><b>RQ2</b><div><h3>Khó ở việc bám quy trình và ràng buộc</h3><p>Đọc hiểu văn bản và sắp xếp toàn cục là hai năng lực khác nhau.</p></div></section><section><b>RQ3</b><div><h3>MANS cải thiện nhờ phân vai</h3><p>Có lợi về WRT trong thí nghiệm; vẫn cần kiểm tra lịch và đánh đổi chất lượng.</p></div></section></div>", "note": "Kết luận thứ nhất là không nên đánh giá agent chỉ bằng văn bản trả lời nghe hợp lý. Thứ hai, kiểm tra đầu ra trung gian và ràng buộc là thiết yếu. Thứ ba, MANS cho thấy phân vai có ích nhưng không bảo đảm lịch luôn khả thi hay tối ưu. Việc ứng dụng vào lập kế hoạch cần đánh giá tính khả thi, độ lệch makespan và khả năng xử lý dữ liệu thực tế.", "source": "Mục 4–6, Bảng 2, 4, 5", "page": 8}];let current=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));const stage=document.querySelector('#stage');function inner(s,i){return `<header><h2>${s.title}</h2></header><main>${s.body}</main><footer><a href="https://aclanthology.org/2026.acl-long.1648.pdf#page=${s.page}" target="_blank" rel="noopener">Nguồn: Liao và cộng sự, ACL 2026 · ${s.source}</a><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></footer>`}function gantt(order){let rows=order===0?[[['A',0,3],['B',3,5]],[['A',3,5],['B',5,9]]]:[[['B',0,2],['A',2,5]],[['B',2,6],['A',6,8]]];return `<div class="gantt-title">${order===0?'A trước · 9 phút':'B trước · 8 phút'}</div>`+rows.map((r,i)=>`<div class="gantt-row"><span>Máy ${i?'sơn':'cắt'}</span><div class="timeline">${r.map(([t,s,e])=>`<div class="block ${t==='B'?'b':''}" style="left:${s/9*100}%;width:${(e-s)/9*100}%">${t} · ${s}–${e}</div>`).join('')}</div></div>`).join('')}function fillGantts(){document.querySelectorAll('#example-gantts').forEach(e=>e.innerHTML=gantt(0)+gantt(1))}function render(){stage.className=current===0?'cover':'';stage.innerHTML=inner(slides[current],current);document.querySelector('#notes').textContent=slides[current].note;history.replaceState(null,'','#'+(current+1));fillGantts()}function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1440,innerHeight/900))}let digits='';document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[0-9]$/.test(e.key)){digits+=e.key;return}if(e.key==='Enter'&&digits){go(Number(digits)-1);digits='';return}digits='';if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='n')document.querySelector('#notes').classList.toggle('open');if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));window.addEventListener('resize',resize);window.addEventListener('beforeprint',()=>{document.querySelector('#print').innerHTML=slides.map((s,i)=>`<article class="print-slide ${i===0?'cover':''}">${inner(s,i)}</article>`).join('');stage.style.display='none';fillGantts()});window.addEventListener('afterprint',()=>{stage.style.display='';document.querySelector('#print').innerHTML=''});resize();render();</script><script>
(()=>{let digits='',timer;function count(){return typeof slides!=='undefined'?slides.length:0}function index(){return Math.max(0,(parseInt(location.hash.slice(1))||1)-1)}function move(n){n=Math.max(0,Math.min(count()-1,n));if(typeof go==='function')go(n);else if(typeof jumpTo==='function')jumpTo(n+1);else location.hash=n+1}function clear(){digits='';clearTimeout(timer)}window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable=true]'))return;let k=e.key;let used=true;if(/^[0-9]$/.test(k)){digits+=k;clearTimeout(timer);timer=setTimeout(clear,4000)}else if(k==='Enter'&&digits){let target=Number(digits)-1;clear();if(target>=0&&target<count())move(target)}else if(['ArrowRight','PageDown',' ','Spacebar','Space','Enter'].includes(k)){clear();if(k==='Enter'&&e.target.closest('a,button'))return;move(index()+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(k)){clear();move(index()-1)}else if(k==='Home'){clear();move(0)}else if(k==='End'){clear();move(count()-1)}else if(k.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{})}else if(k.toLowerCase()==='n'&&document.querySelector('#notes')){document.querySelector('#notes').classList.toggle('open')}else if(k==='Escape'){clear();document.querySelector('#notes')?.classList.remove('open')}else used=false;if(used){e.preventDefault();e.stopImmediatePropagation()}},true);document.addEventListener('click',e=>{if(e.target.closest('a,button,input,textarea,select,summary,details,#notes'))return;if(window.getSelection()?.toString())return;document.activeElement?.blur();window.focus();e.preventDefault();e.stopImmediatePropagation();move(index()+(e.clientX<innerWidth*.22?-1:1))},true);let startX;window.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});window.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>80)move(index()+(dx<0?1:-1))},{passive:true});document.body.tabIndex=-1;document.body.focus({preventScroll:true});window.focus()})();
</script></html>
