x;left:5%;width:90%;padding:25px;background:#12283f;color:white;font-size:20px;line-height:1.6;z-index:5}#notes.open{display:block}@media print{@page{size:1440px 900px;margin:0}body{background:white}#stage{position:static;transform:none;padding:54px 68px}#controls,#notes{display:none}.print-slide{width:1440px;height:900px;padding:54px 68px;display:flex;flex-direction:column;break-after:page}.print-slide main{flex:1}.print-slide:last-child{break-after:auto}}body{overflow:hidden}#controls{display:none!important}footer{border-top:0}#stage{cursor:default}.visual-layout{display:grid;grid-template-columns:1.35fr 1fr;gap:55px;height:570px;align-items:center}.visual-layout figure{height:100%;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center}.visual-layout img{width:100%;max-height:520px;object-fit:contain}.visual-layout p{font-size:26px}.visual-layout figcaption,.dataset-figure figcaption{font-size:16px;color:#607387;margin-top:15px}.spaced{margin-top:38px}.architecture{grid-template-columns:1.45fr 1fr}.role-legend>div{padding:17px 0;border-bottom:1px solid #dce4e9}.role-legend b{font-size:27px;color:#087f83}.role-legend p{font-size:23px;margin-top:8px}.dataset-figure{margin:20px 0 0;text-align:center}.dataset-figure img{width:100%;height:295px;object-fit:contain}.experiment{display:flex;align-items:center;gap:25px;margin-bottom:35px}.experiment section{flex:1;background:#f0f6f7;padding:20px 25px;border-top:4px solid #168d91}.experiment strong{font-size:33px;display:block;margin:10px 0}.experiment span{font-size:18px;color:#526577}.experiment p{font-size:21px}.exp-arrow{font-size:32px;color:#168d91}.cover{background:linear-gradient(115deg,#fff 65%,#eef7f7 65%)!important}.cover h2{max-width:1100px}.cover footer{background:transparent}.bars>div{margin:34px 0}.track{height:40px}.rows section{padding:29px 0}@media print{body{overflow:visible}}</style><div id="stage"></div><div id="print"></div><aside id="notes"></aside><script>const slides=[{"title": "AI Agent trong lập kế hoạch<br>và lập lịch công việc", "body": "<div class=\"cover-meta\">NL ⇒ Schedule · MANS</div><p class=\"big\">Chuyển mô tả ngôn ngữ tự nhiên thành lịch thực hiện có ràng buộc tài nguyên</p><div class=\"cover-line\">Wenrui Liao · Weihong Du · Yi Li · Hongru Liang · Wenqiang Lei<br>ACL 2026 — Long Papers</div>", "note": "Hôm nay em trình bày ứng dụng AI Agent trong pha lập kế hoạch, tập trung vào lập lịch công việc. Nguồn chính là bài NL ⇒ Schedule tại ACL 2026. Bài đề xuất MANS, một quy trình bốn tác tử, cùng bộ dữ liệu và mã nguồn. Em sẽ giải thích cơ chế, phân tích kết quả rồi minh họa bằng một ví dụ nhỏ. Phạm vi là lập lịch, không phải toàn bộ quản lý dự án hay hệ thống phân tích rủi ro.", "source": "Trang đầu, tóm tắt", "page": 1}, {"title": "Bài toán lập lịch từ mô tả công việc", "body": "<div class=\"visual-layout\"><figure><img src=\"assets/paper-figure-1.png\" alt=\"Hình 1 của bài báo: mô tả bằng văn bản và ma trận được chuyển thành lịch sử dụng tài nguyên\"><figcaption>Hình 1 · Ví dụ lập lịch trong bài báo</figcaption></figure><section><h3>Yêu cầu bằng văn bản</h3><p>Nhiều nhiệm vụ có các công đoạn và tài nguyên dùng chung.</p><h3 class=\"spaced\">Lịch thực hiện cụ thể</h3><p>Mỗi thanh là một công đoạn. Vị trí biểu diễn thời điểm; độ dài biểu diễn thời lượng.</p><p class=\"small\">Các tài nguyên khác nhau có thể làm song song.</p></section></div>", "note": "Một yêu cầu nghe đơn giản vẫn ẩn nhiều ràng buộc. Hai sản phẩm có thể làm song song, nhưng không thể chiếm cùng một máy tại cùng thời điểm. Ngoài ra, công đoạn sơn phải chờ cắt xong. Vì vậy, chỉ tóm tắt yêu cầu thành danh sách việc chưa đủ: hệ thống phải tạo được lịch có thể thực hiện.", "source": "Mục 1, 3; ví dụ do nhóm xây dựng", "page": 1}, {"title": "Phạm vi và ba câu hỏi nghiên cứu", "body": "<div class=\"rows\"><section><b>RQ1</b><div><h3>LLM có tự lập lịch tốt không?</h3><p>Đánh giá trực tiếp từ mô tả tự nhiên đến lịch đầu ra.</p></div></section><section><b>RQ2</b><div><h3>Mô hình sai ở đâu?</h3><p>Phân biệt hiểu ngôn ngữ với việc bám đúng quy trình và ràng buộc.</p></div></section><section><b>RQ3</b><div><h3>Phối hợp nhiều agent có cải thiện không?</h3><p>Đề xuất MANS và so sánh với các phương pháp LLM kết hợp solver.</p></div></section></div>", "note": "Bài báo có ba câu hỏi. Thứ nhất, khả năng lập lịch trực tiếp của các LLM hiện có. Thứ hai, phân tích lỗi thay vì chỉ nhìn một điểm số tổng. Thứ ba, thiết kế quy trình đa tác tử để cải thiện. Nghiên cứu không đặt mục tiêu tự động hóa toàn bộ SDLC; điều này phù hợp với hướng thu hẹp đề tài vào một pha cụ thể.", "source": "Mục 1, 4", "page": 2}, {"title": "Các ràng buộc của một lịch hợp lệ", "body": "<div class=\"cols\"><section><h3>Thứ tự công đoạn</h3><div class=\"mini\">Cắt A → Sơn A<br>Cắt B → Sơn B</div><p>Mỗi bước chỉ bắt đầu khi bước trước đã kết thúc.</p></section><section><h3>Năng lực tài nguyên</h3><div class=\"mini\">Máy cắt: tối đa 1 việc<br>Máy sơn: tối đa 1 việc</div><p>Các bước dùng chung máy không được chồng thời gian.</p></section><section><h3>Thời lượng và mục tiêu</h3><div class=\"mini\">Kết thúc − bắt đầu<br>= thời lượng yêu cầu</div><p>Giảm makespan: thời điểm hoàn thành bước cuối cùng.</p></section></div>", "note": "Ta cần nắm ba yếu tố để hiểu các slide sau. Một là phụ thuộc giữa công đoạn. Hai là năng lực của tài nguyên; trong ví dụ, mỗi máy chỉ làm một việc tại một thời điểm. Ba là thời lượng phải đúng. Khi đã hợp lệ, ta mới xét chất lượng lịch qua makespan. Lịch ngắn nhưng vi phạm ràng buộc không phải phương án chấp nhận được.", "source": "Mục 3; ví dụ minh họa", "page": 3}, {"title": "MANS: bốn agent, bốn nhiệm vụ", "body": "<div class=\"visual-layout architecture\"><figure><img src=\"assets/paper-figure-5.png\" alt=\"Hình 5 gốc: Seeker, Weaver, Verifier và Architect phối hợp trong MANS\"><figcaption>Hình 5 · Kiến trúc MANS nguyên bản</figcaption></figure><section class=\"role-legend\"><div><b>01 · Seeker</b><p>Đủ nhiệm vụ, đúng số lượng</p></div><div><b>02 · Weaver</b><p>Đủ bước, máy và thời lượng</p></div><div><b>03 · Verifier</b><p>Đối chiếu và sửa dữ liệu</p></div><div><b>04 · Architect</b><p>Lập lịch từ bản đã kiểm tra</p></div></section></div>", "note": "Bốn agent ở đây là bốn vai trò được gọi tuần tự, không nhất thiết là bốn mô hình độc lập hay bốn bot chạy song song. Seeker khoanh đúng phạm vi. Weaver làm rõ từng công đoạn. Verifier kiểm tra cấu trúc đó với văn bản gốc. Architect nhận cấu trúc đã kiểm tra để lập lịch. Phân vai giúp giảm khối lượng suy luận của mỗi lượt gọi.", "source": "Mục 4.3.1, Hình 5", "page": 7}, {"title": "Seeker và Weaver: trích xuất đúng công việc", "body": "<div class=\"cols\"><section><h3>Seeker · không bỏ sót nhiệm vụ</h3><blockquote>Sản phẩm A và B</blockquote><p>Ghi nhận đúng số lượng và từng nhiệm vụ phải hoàn thành.</p></section><section><h3>Weaver · làm rõ từng công đoạn</h3><table><thead><tr><th>Việc</th><th>Bước 1</th><th>Bước 2</th></tr></thead><tbody><tr><td>A</td><td>Cắt · 3 phút</td><td>Sơn · 2 phút</td></tr><tr><td>B</td><td>Cắt · 2 phút</td><td>Sơn · 4 phút</td></tr></tbody></table></section></div>", "note": "Seeker chỉ tập trung xác định nhiệm vụ, tránh bị phân tán bởi các chi tiết máy và thời gian. Weaver tiếp tục bóc tách mỗi nhiệm vụ thành các bước. Ví dụ A cần cắt ba phút rồi sơn hai phút; B cần cắt hai phút rồi sơn bốn phút. Bảng này là dữ liệu có cấu trúc, chưa phải lịch vì chưa có thời điểm bắt đầu.", "source": "Mục 4.3.1; ví dụ do nhóm xây dựng", "page": 7}, {"title": "Verifier: kiểm tra trước khi lập lịch", "body": "<div class=\"split\"><div><p class=\"big\">Văn bản gốc là căn cứ kiểm tra.</p><ul><li>Đã đủ nhiệm vụ và số lần thực hiện?</li><li>Đã đủ bước và đúng thứ tự?</li><li>Máy và thời lượng có khớp mô tả?</li></ul></div><div class=\"audit\"><span>DỮ LIỆU BỊ SAI</span><h3>B · Sơn · 3 phút</h3><div class=\"arrow\">↓ đối chiếu yêu cầu ↓</div><span>DỮ LIỆU ĐÃ SỬA</span><h3>B · Sơn · 4 phút</h3></div></div>", "note": "Verifier không đơn giản là hỏi mô hình có chắc không. Vai trò này phải đối chiếu từng trường với đầu vào gốc. Ví dụ nếu Weaver đọc nhầm thời gian sơn B thành ba phút, Verifier cần sửa thành bốn. Đây là kiểm tra ngữ nghĩa bằng LLM, vẫn có thể sai. Sau khi Architect lập lịch, ta còn cần kiểm tra ràng buộc bằng chương trình.", "source": "Mục 4.3.1; lỗi giả định để minh họa", "page": 7}, {"title": "Architect: chọn thứ tự sử dụng tài nguyên", "body": "<p>Hai phương án đều đúng ràng buộc, nhưng thời gian hoàn thành khác nhau.</p><div id=\"example-gantts\"></div><div class=\"wide\">Ưu tiên B trên máy cắt giúp máy sơn xử lý công đoạn dài sớm hơn.</div>", "note": "Nếu làm A trước, máy cắt làm A từ 0 đến 3 rồi B từ 3 đến 5; máy sơn làm A từ 3 đến 5 rồi B từ 5 đến 9. Nếu B trước, B được sơn từ 2 đến 6, trong lúc A được cắt từ 2 đến 5; sau đó sơn A từ 6 đến 8. Makespan giảm từ chín xuống tám phút. Đây là ví dụ tính tay của nhóm, không phải số liệu thực nghiệm trong bài.", "source": "Ví dụ tính toán của nhóm; nguyên lý theo mục 3, 4.3.1", "page": 7}, {"title": "Bộ dữ liệu NL ⇒ Schedule", "body": "<div class=\"stats\"><div><strong>240</strong><span>trường hợp</span></div><div><strong>4</strong><span>bối cảnh</span></div><div><strong>5–10</strong><span>nhiệm vụ / trường hợp</span></div></div><figure class=\"dataset-figure\"><img src=\"assets/paper-figure-2.png\" alt=\"Hình 2: quy trình tạo dữ liệu lập lịch NL2Schedule\"><figcaption>Hình 2 · Dữ liệu cấu trúc → ghép bài toán → sinh mô tả tự nhiên</figcaption></figure><p class=\"small\">Dữ liệu bán tổng hợp; OR-Tools tạo lịch tối ưu tham chiếu. Không phải 240 dự án vận hành thực tế.</p>", "note": "Tác giả thu thập 135 nhiệm vụ cơ bản từ các nguồn công khai, rồi ghép thành 240 bài toán. Mỗi bối cảnh có mười trường hợp cho từng cỡ từ năm đến mười nhiệm vụ: bốn nhân mười nhân sáu bằng 240. OR-Tools cung cấp lịch tối ưu tham chiếu. Mô tả tự nhiên được tạo từ dữ liệu cấu trúc bằng pipeline data2text. Cần gọi đúng đây là dữ liệu bán tổng hợp.", "source": "Mục 3, Bảng 1", "page": 3}, {"title": "Thiết kế thực nghiệm và thước đo", "body": "<div class=\"experiment\"><section><span>Đánh giá trực tiếp</span><strong>9 LLM</strong><p>Văn bản → lịch</p></section><div class=\"exp-arrow\">→</div><section><span>Phân tích lỗi</span><strong>RQ1 / RQ2</strong><p>Đủ bước? Đúng thứ tự? Trùng máy?</p></section><div class=\"exp-arrow\">→</div><section><span>Cải thiện</span><strong>MANS</strong><p>So với 6 tổ hợp LLM + solver</p></section></div><div class=\"cols\"><section><h3>Hai nhóm so sánh</h3><p>So sánh chính dùng Gemini 2.5 Flash ở chế độ không thinking.</p></section><section><h3>Đánh giá từ đúng đến tốt</h3><table><thead><tr><th>Chỉ số</th><th>Ý nghĩa</th></tr></thead><tbody><tr><td>SER</td><td>Mức thực hiện đúng các bước</td></tr><tr><td>TCR</td><td>Tỷ lệ nhiệm vụ hoàn tất</td></tr><tr><td>SFR</td><td>Tỷ lệ lịch hoàn toàn khả thi</td></tr><tr><td>WRT / RMD</td><td>Thời gian tệ nhất / độ lệch makespan</td></tr></tbody></table></section></div>", "note": "SER đo mức thực hiện đúng các bước, TCR đo nhiệm vụ hoàn tất, còn SFR yêu cầu cả lịch đều khả thi. Vì thế SER cao không có nghĩa cả lịch dùng được. WRT đo thời gian chạy tệ nhất trong thiết lập thí nghiệm. RMD đo độ lệch makespan so với lịch tham chiếu, trên các lịch khả thi. Khi so sánh phải giữ đúng mô hình nền và quy mô bài toán.", "source": "Mục 4.1.1–4.1.2, 4.3.1", "page": 4}, {"title": "LLM trực tiếp vẫn khó tạo lịch khả thi", "body": "<p>SFR ở bài toán 5 nhiệm vụ · một số mô hình trong Bảng 2</p><div class=\"bars\"><div><span>GPT-4.1</span><div class=\"track\"><i style=\"width:5%\"></i></div><b>5%</b></div><div><span>Gemini 2.5 Flash · no thinking</span><div class=\"track\"><i style=\"width:20%\"></i></div><b>20%</b></div><div><span>o4-mini</span><div class=\"track\"><i style=\"width:32.5%\"></i></div><b>32.5%</b></div><div><span>Gemini 2.5 Pro</span><div class=\"track\"><i style=\"width:32.5%\"></i></div><b>32.5%</b></div></div><div class=\"wide\">Hiểu đúng văn bản chưa đủ để xử lý đồng thời mọi phụ thuộc và xung đột.</div>", "note": "Ở nhóm năm nhiệm vụ, GPT-4.1 có SFR năm phần trăm; Gemini Flash hai mươi phần trăm; o4-mini và Gemini Pro đều ba mươi hai phẩy năm phần trăm. Các con số là kết quả của bài báo với thiết lập lúc nghiên cứu, không phải đánh giá mọi phiên bản hiện tại. Điểm đáng chú ý là ngay mô hình mạnh vẫn có nhiều lịch không khả thi.", "source": "Bảng 2; chỉ trích nhóm #Task=5", "page": 5}, {"title": "Tốc độ và chất lượng lịch của MANS", "body": "<table><thead><tr><th>Phương pháp</th><th>WRT · giây ↓</th><th>RMD ↓</th></tr></thead><tbody><tr><td>CoE + MOPNR</td><td>128.42</td><td>0.192</td></tr><tr><td>CoE + OR-Tools</td><td>154.44</td><td>0.023</td></tr><tr><td>Optimus + OR-Tools</td><td>133.70</td><td>0.022</td></tr><tr><td>MANS</td><td>79.59</td><td>0.085</td></tr></tbody></table><div class=\"cols insight\"><section><h3>WRT thấp hơn</h3><p>MANS giảm khoảng 40,5% so với Optimus + OR-Tools.</p></section><section><h3>Chưa tốt nhất về makespan</h3><p>RMD 0.085 cao hơn 0.022 của Optimus + OR-Tools.</p></section></div>", "note": "Bảng bốn cho thấy một sự đánh đổi. MANS có WRT 79,59 giây, so với 133,70 của Optimus cộng OR-Tools, tương ứng giảm khoảng 40,5 phần trăm. Nhưng RMD của MANS là 0,085, cao hơn 0,022; lịch khả thi của nó lệch tối ưu nhiều hơn. Vì vậy không kết luận MANS thắng mọi mặt. Bảng trên chọn bốn hàng, không phải toàn bộ sáu baseline.", "source": "Bảng 4; phần trăm tính từ số liệu gốc", "page": 8}, {"title": "Mỗi vai trò có đóng góp riêng", "body": "<p>SFR khi bỏ từng agent · bài toán 5 nhiệm vụ, cùng thiết lập thí nghiệm</p><div class=\"bars\"><div><span>MANS đầy đủ</span><div class=\"track\"><i style=\"width:40%\"></i></div><b>40%</b></div><div><span>Bỏ Seeker</span><div class=\"track\"><i style=\"width:20%\"></i></div><b>20%</b></div><div><span>Bỏ Weaver</span><div class=\"track\"><i style=\"width:37.5%\"></i></div><b>37.5%</b></div><div><span>Bỏ Verifier</span><div class=\"track\"><i style=\"width:30%\"></i></div><b>30%</b></div></div><div class=\"wide\">Bỏ Seeker làm SFR giảm từ 40% xuống 20%; xác định đúng phạm vi là bước quan trọng.</div>", "note": "Ablation study là thí nghiệm bỏ từng thành phần để xem vai trò của nó. Với năm nhiệm vụ, MANS đầy đủ có SFR bốn mươi phần trăm. Bỏ Seeker còn hai mươi; bỏ Weaver còn ba mươi bảy phẩy năm; bỏ Verifier còn ba mươi. Điều này ủng hộ việc phân vai, nhưng SFR bốn mươi phần trăm cũng cho thấy hệ thống chưa đủ tin cậy để tự động dùng mọi đầu ra.", "source": "Bảng 5, mục 4.3.2", "page": 8}, {"title": "Giá trị và giới hạn của nghiên cứu", "body": "<div class=\"cols\"><section><h3>Đóng góp</h3><ul><li>Nối mô tả văn bản với lịch thực thi.</li><li>Benchmark có cấu trúc và lịch tham chiếu.</li><li>Quy trình bốn agent có mã nguồn công khai.</li></ul></section><section><h3>Giới hạn</h3><ul><li>Dữ liệu bán tổng hợp; quy mô 5–10 nhiệm vụ.</li><li>Chưa xét thời lượng ngẫu nhiên, tài nguyên biến động.</li><li>Lịch đầu ra vẫn có thể không khả thi.</li></ul></section></div>", "note": "Giá trị của bài là bài toán rõ, dữ liệu có chuẩn so sánh và mã nguồn để tiếp cận cơ chế. Tuy nhiên, bài chưa giải quyết các yếu tố thực tế như máy hỏng đột ngột hoặc thời lượng bất định. Vì vậy ta chỉ xem nó là nền cho trợ lý lập lịch, không tự gán thành hệ thống phân tích rủi ro toàn diện.", "source": "Mục 5–6; repository chính thức", "page": 9}, {"title": "Demo: theo dõi từng bước xử lý", "body": "<div class=\"flow\"><section><b>Đầu vào</b><p>A: cắt 3 → sơn 2; B: cắt 2 → sơn 4</p></section><section><b>Bốn vai trò</b><p>Xem nhiệm vụ, bước và kết quả kiểm tra</p></section><section><b>Đầu ra</b><p>Lịch Gantt + kiểm tra thứ tự, máy và thời lượng</p></section></div><div class=\"cols insight\"><section><h3>Minh họa offline</h3><p>Ví dụ cố định, có thể đổi thời lượng và chèn lỗi để thấy cơ chế kiểm tra.</p></section><section><h3>Chạy LLM</h3><p>Gọi bốn lượt theo vai trò MANS; cần cấu hình API trên máy.</p></section></div><a class=\"demo-link\" href=\"demo/index.html\" target=\"_blank\">Mở demo →</a>", "note": "Em bắt đầu demo ở chế độ offline để giải thích cơ chế ổn định. Đây là minh họa do nhóm viết, không giả lập nó thành suy luận LLM. Sau đó có thể thử chèn lỗi thời lượng để Verifier sửa, hoặc chèn xung đột để bộ kiểm tra lịch phát hiện. Chế độ LLM dùng bốn lượt gọi thật khi có cấu hình API. Giao diện và kiểm tra cục bộ là phần nhóm bổ sung.", "source": "Demo của nhóm, dựa trên vai trò MANS mục 4.3.1", "page": 7}, {"title": "Khả năng triển khai từ mã nguồn", "body": "<div class=\"cols\"><section><h3>Mã tác giả có gì?</h3><p>Python, prompt của bốn vai trò, dữ liệu JSONL, chương trình sinh và đánh giá lịch.</p><p>Liên kết source được dẫn ở trang đầu PDF.</p></section><section><h3>Những điểm cần chỉnh</h3><p>API key và endpoint còn là placeholder.</p><p>Architect đang nhận kết quả Weaver thay vì bản đã sửa của Verifier.</p><p>Script mẫu cần điều chỉnh đường dẫn dữ liệu.</p></section></div><p class=\"small\">Kiểm tra cục bộ: bộ đánh giá chạy được; lịch mẫu của repository có SF=False. Chưa chạy benchmark bằng API.</p>", "note": "Có mã nguồn thực, nhưng không nên nói tải về là chạy trơn tru. Khi đọc source, nhóm thấy dữ liệu Verifier đã sửa chưa được truyền đúng sang Architect. Đây là lỗi tích hợp có thể sửa. Chương trình đánh giá chạy được trên môi trường kiểm tra, nhưng lịch mẫu không khả thi. Demo của nhóm triển khai lại phần giao diện và quy trình nhỏ, phân biệt rõ với source gốc được liên kết trong tài liệu.", "source": "Kiểm tra commit 47f62b0 của SCUNLP/NL2Schedule, ngày 31/10/2026", "page": 1}, {"title": "Ứng dụng vào pha lập kế hoạch dự án", "body": "<div class=\"rows\"><section><b>01</b><div><h3>Chuẩn hóa đầu vào</h3><p>Mô tả công việc, phụ thuộc, tài nguyên và thời lượng rõ ràng.</p></div></section><section><b>02</b><div><h3>Đề xuất và kiểm tra lịch</h3><p>Agent lập phương án; chương trình kiểm tra xung đột; người quản lý xem xét.</p></div></section><section><b>03</b><div><h3>Mở rộng phân tích tình huống</h3><p>Thử tăng thời lượng hoặc giảm tài nguyên để quan sát tác động đến kế hoạch.</p></div></section></div>", "note": "Để áp dụng vào đề tài, nhóm ưu tiên một quy trình có dữ liệu đủ rõ và quy mô nhỏ. Kết quả cần được kiểm tra trước khi người quản lý quyết định. Phần phân tích tình huống tăng thời lượng là hướng mở rộng của nhóm, không phải đóng góp đã được kiểm chứng trong bài. Cũng không nên đồng nhất các xung đột lịch với toàn bộ rủi ro dự án.", "source": "Đề xuất áp dụng của nhóm; giới hạn gốc ở mục 6", "page": 9}, {"title": "Kết luận theo ba câu hỏi nghiên cứu", "body": "<div class=\"rows\"><section><b>RQ1</b><div><h3>LLM chưa lập lịch đủ tin cậy</h3><p>SFR thấp ngay ở bài toán nhỏ; cần đánh giá khả thi rõ ràng.</p></div></section><section><b>RQ2</b><div><h3>Khó ở việc bám quy trình và ràng buộc</h3><p>Đọc hiểu văn bản và sắp xếp toàn cục là hai năng lực khác nhau.</p></div></section><section><b>RQ3</b><div><h3>MANS cải thiện nhờ phân vai</h3><p>Có lợi về WRT trong thí nghiệm; vẫn cần kiểm tra lịch và đánh đổi chất lượng.</p></div></section></div>", "note": "Kết luận thứ nhất là không nên đánh giá agent chỉ bằng văn bản trả lời nghe hợp lý. Thứ hai, kiểm tra đầu ra trung gian và ràng buộc là thiết yếu. Thứ ba, MANS cho thấy phân vai có ích nhưng không bảo đảm lịch luôn khả thi hay tối ưu. Với bài tập lớn, một demo nhỏ có Gantt và bộ kiểm tra rõ ràng giúp thể hiện đúng cơ chế, đồng thời có tiêu chí để đánh giá.", "source": "Mục 4–6, Bảng 2, 4, 5", "page": 8}];let current=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));const stage=document.querySelector('#stage');function inner(s,i){return `<header><h2>${s.title}</h2></header><main>${s.body}</main><footer><a href="https://aclanthology.org/2026.acl-long.1648.pdf#page=${s.page}" target="_blank" rel="noopener">Nguồn: Liao và cộng sự, ACL 2026 · ${s.source}</a><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></footer>`}function gantt(order){let rows=order===0?[[['A',0,3],['B',3,5]],[['A',3,5],['B',5,9]]]:[[['B',0,2],['A',2,5]],[['B',2,6],['A',6,8]]];return `<div class="gantt-title">${order===0?'A trước · 9 phút':'B trước · 8 phút'}</div>`+rows.map((r,i)=>`<div class="gantt-row"><span>Máy ${i?'sơn':'cắt'}</span><div class="timeline">${r.map(([t,s,e])=>`<div class="block ${t==='B'?'b':''}" style="left:${s/9*100}%;width:${(e-s)/9*100}%">${t} · ${s}–${e}</div>`).join('')}</div></div>`).join('')}function fillGantts(){document.querySelectorAll('#example-gantts').forEach(e=>e.innerHTML=gantt(0)+gantt(1))}function render(){stage.className=current===0?'cover':'';stage.innerHTML=inner(slides[current],current);document.querySelector('#notes').textContent=slides[current].note;history.replaceState(null,'','#'+(current+1));fillGantts()}function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1440,innerHeight/900))}let digits='';document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[0-9]$/.test(e.key)){digits+=e.key;return}if(e.key==='Enter'&&digits){go(Number(digits)-1);digits='';return}digits='';if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='n')document.querySelector('#notes').classList.toggle('open');if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));window.addEventListener('resize',resize);window.addEventListener('beforeprint',()=>{document.querySelector('#print').innerHTML=slides.map((s,i)=>`<article class="print-slide ${i===0?'cover':''}">${inner(s,i)}</article>`).join('');stage.style.display='none';fillGantts()});window.addEventListener('afterprint',()=>{stage.style.display='';document.querySelector('#print').innerHTML=''});resize();render();</script><script src="presentation-nav.js"></script></html>
