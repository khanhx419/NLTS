ng việc", "body": "<div class=\"cover-meta\">NL ⇒ Schedule · MANS</div><p class=\"big\">Chuyển mô tả ngôn ngữ tự nhiên thành lịch thực hiện có ràng buộc tài nguyên</p><div class=\"cover-line\">Wenrui Liao · Weihong Du · Yi Li · Hongru Liang · Wenqiang Lei<br>ACL 2026 — Long Papers</div>", "note": "Hôm nay em trình bày ứng dụng AI Agent trong pha lập kế hoạch, tập trung vào lập lịch công việc. Nguồn chính là bài NL ⇒ Schedule tại ACL 2026. Bài đề xuất MANS, một quy trình bốn tác tử, cùng bộ dữ liệu và mã nguồn. Em sẽ giải thích cơ chế, phân tích kết quả rồi minh họa bằng một ví dụ nhỏ. Phạm vi là lập lịch, không phải toàn bộ quản lý dự án hay hệ thống phân tích rủi ro.", "source": "Trang đầu, tóm tắt", "page": 1}, {"title": "Từ bảng dữ liệu đến lập lịch trực tiếp từ văn bản", "body": "<div class=\"visual-layout\" style=\"grid-template-columns:1fr 1.45fr;gap:42px;height:600px\"><figure><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAxIAAAKVCAIAAADUZEpIAAAACXBIWXMAAA7EAAAOxAGVKw4bAAGZJElEQVR4nOydB3hURdeAQeSnCShdAWmKioig6IeoSLFiAynSpPfeBVGQjtJ77y1A6E0glISW3nvvm2RTN73/792BdUk2cRMCEZnDPDyb3XvPnDkzd847c+fOLZOrJzk5OYGBAXfNr/ra30oJcU0Pcc0Mc5dJJplkkkkmmWR6ehL8kxjo4nLnutVtC3VUlD4pldF9StRorG+bh7tZSVqSSSaZZJJJJplkSgt29bO/5Whnk5GR8QA2JSZqbG5eSwlyKXUTZZJJJplkkkkmmf49SRPgZHXLQpCTgk3p6enWN6+nBDqXumUyySSTTDLJJJNM/7ak8Xeyt7G+h00ebq4JPvalbpNMMskkk0wyySTTvzP52d9SR0Up2GR/+1qpWyOTTDLJJJNMMsn0r02pwa42d2+XUavVAQ63S90amWSSSSaZZJJJpn9zcrO+WcbdzTXay7bUTZFJJplkkkkmmWT6N6fkILcyttZWsd52pW6KTDLJJJNMMskk0785pYe4lbG2vBsjZ5tkkkkmmWSSSSaZ/ilJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKklskkkmmWSSSSaZZDIqSWySSSaZZJJJJplkMipJbJJJJplkkkkmmWQyKpUMNiX6O0R7Wkd7Wskkk0xPW4r1skkPcS31vsz4lBHqFu9jV+p+k0kmmUolcfnTCZQyNm3+c/4XnT7+slMHmWSS6alKXPg/ft/V3+ZqqcOQ8SnBx27WhJGyy5JJpqcwceFPGTWEwV4pY9OUUYP79u17UYoUKU+ZmJ font-size:21px;line-height:1.45;font-weight:650\">Mô tả bằng lời → Bốn vai trò LLM → Lịch từng công đoạn</p><p style=\"font-size:21px;line-height:1.45;color:#526577;margin-top:9px\">LLM trích xuất công việc, kiểm tra và sắp xếp thời gian; không gọi bộ giải ngoài để tính lịch.</p></div></section></div>", "note": "Cách truyền thống bắt đầu từ yêu cầu của người dùng, nhưng chương trình tính lịch không tự đọc hiểu mô tả đó. Con người phải chuyển yêu cầu thành bảng số, hay ma trận. Ví dụ, bảng ghi sản phẩm A dùng máy cắt trong ba phút, rồi dùng máy sơn trong hai phút. Bộ giải, tiếng Anh là solver, là chương trình tìm cách sắp xếp thời gian sao cho đúng các điều kiện đã nhập. Đầu ra là thời điểm bắt đầu và kết thúc của từng công đoạn. Ở hướng LLM kết hợp bộ giải, LLM giúp chuyển văn bản thành mô hình toán và mã mà bộ giải sử dụng; bộ giải vẫn chịu trách nhiệm tính lịch. Với MANS, LLM đảm nhiệm cả việc hiểu văn bản, tách nhiệm vụ, kiểm tra thông tin và đề xuất lịch cụ thể qua bốn vai trò. End-to-end không có nghĩa chỉ một lượt gọi LLM, mà là đi từ mô tả bằng lời tới lịch mà không cần con người mã hóa ma trận hoặc dùng bộ giải bên ngoài để tính lịch trong luồng MANS. Lịch do LLM tạo vẫn cần kiểm tra tính hợp lệ.", "source": "Mục 1–2, 4.3.1 và Hình 1: Matrix2Schedule, LLM + solver, MANS", "page": 1}, {"title": "Phạm vi và ba câu hỏi nghiên cứu", "body": "<div class=\"rows\"><section><b>RQ1</b><div><h3>LLM có tự lập lịch tốt không?</h3><p>Đánh giá trực tiếp từ mô tả tự nhiên đến lịch đầu ra.</p></div></section><section><b>RQ2</b><div><h3>Mô hình sai ở đâu?</h3><p>Phân biệt hiểu ngôn ngữ với việc bám đúng quy trình và ràng buộc.</p></div></section><section><b>RQ3</b><div><h3>Phối hợp nhiều agent có cải thiện không?</h3><p>Đề xuất MANS và so sánh với các phương pháp LLM kết hợp solver.</p></div></section></div>", "note": "Bài báo có ba câu hỏi. Thứ nhất, khả năng lập lịch trực tiếp của các LLM hiện có. Thứ hai, phân tích lỗi thay vì chỉ nhìn một điểm số tổng. Thứ ba, thiết kế quy trình đa tác tử để cải thiện. Nghiên cứu không đặt mục tiêu tự động hóa toàn bộ SDLC; điều này phù hợp với hướng thu hẹp đề tài vào một pha cụ thể.", "source": "Mục 1, 4", "page": 2}, {"title": "Ràng buộc và mục tiêu lập lịch", "body": "<div class=\"cols\"><section><h3>01 · Thứ tự công đoạn</h3><div class=\"mini\">Cắt A → Sơn A<br>Cắt B → Sơn B</div><p>Mỗi bước chỉ bắt đầu sau khi bước trước đã kết thúc.</p></section><section><h3>02 · Năng lực tài nguyên</h3><div class=\"mini\">Một máy cắt<br>Một máy sơn</div><p>Hai công đoạn dùng chung máy không được chồng thời gian.</p></section><section><h3>03 · Thời lượng công đoạn</h3><div class=\"mini\">Cắt A cần 3 phút<br>Kết thúc − bắt đầu = 3</div><p>Mỗi bước phải được dành đủ thời lượng yêu cầu, không ngắt quãng.</p></section></div><div class=\"wide\"><b>Mục tiêu: giảm makespan</b><br>Trong các lịch hợp lệ, chọn lịch có thời điểm hoàn thành công đoạn cuối cùng sớm nhất.</div>", "note": "Slide này phân biệt ràng buộc và mục tiêu. Ràng buộc là điều kiện lịch bắt buộc phải đáp ứng: cắt xong mới sơn, không dùng trùng một máy tại cùng thời điểm, và mỗi công đoạn có đủ thời lượng yêu cầu. Ví dụ cắt A cần ba phút thì thời điểm kết thúc phải cách thời điểm bắt đầu đúng ba phút, vì công đoạn không bị ngắt quãng. Khi lịch đã hợp lệ, ta mới xét mục tiêu giảm makespan, tức thời điểm hoàn thành công đoạn cuối cùng. Hai lịch tám và chín phút đều có thể hợp lệ; lịch tám phút tốt hơn theo mục tiêu này.", "source": "Mục 3: ràng buộc thứ tự, máy và mục tiêu makespan; ví dụ minh họa", "page": 3}, {"title": "MANS: bốn agent, bốn nhiệm vụ", "body": "<div class=\"visual-layout architecture\"><figure><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2oAAAKZCAIAAABGOE9fAAAACXBIWXMAAA7EAAAOxAGVKw4bAAShjUlEQVR4nOydB1gVSaK2JeckWXIwIYooCKiAEkSMmBMmEAEVwYA5B8w5JxQDUQUM5JxzzqII6ISdmXt3Z2fnzv67O/t/5xT0nDkEAREQqp/38cE6Haqrq6ve6q6qHvTfz1j++c9//vjjj/X19VVV5Tm5GbW15d99//bjtzWNH6vqGysbPlQ0fqykUCgUCoVCofQw0LCGD5Ufvqn+5rs33/2lrrgkNzcvq6am+uPHj3/961/ JhYpy+R9//NFERGwqPj7QTYctEguKS/kYzQcAAADg2VYozCkrkzYdDh8dH6n8/vvvYrFQUVHM+EsCAAAAgDanVBVpbkpFYn7DMXpMjI9U6urqbt+uEokE8nJxRaWY8RcJAAAAAK1HwZGiXXlFsVRa8uuvvzYnFjY3PhqEyNv5/OwiSV65UoyvswEAAACeUhTk5OVCoThXKBLcv3+/+YGwZfGxPkSq1Wo+Pzc3/5paI0WIBAAAAHiqFJeWFfIFN0Siwurq6pZGQVPiY3356af/SCRFefnZhcI8lVqq1MZYfK8NAAAA8MTRhjRNiUojy875MZ+fK5OV1dTUmBwCTY+P+lJbW/vLL79oNBqFQq7WVPz0k/rmv2VqTQkmrQEAAABgilJVpFQVq29Kb91W/PfOrfIKuUKhqKqqotRYV1fXyvj3P5+Z+UCo5SzDAAAAAElFTkSuQmCC\" alt=\"Hình 5 gốc: Seeker, Weaver, Verifier và Architect phối hợp trong MANS\"><figcaption>Hình 5 · Kiến trúc MANS nguyên bản</figcaption></figure><section class=\"role-legend\"><div><b>01 · Seeker</b><p>Đủ nhiệm vụ, đúng số lượng</p></div><div><b>02 · Weaver</b><p>Đủ bước, máy và thời lượng</p></div><div><b>03 · Verifier</b><p>Đối chiếu và sửa dữ liệu</p></div><div><b>04 · Architect</b><p>Lập lịch từ bản đã kiểm tra</p></div></section></div>", "note": "Bốn agent ở đây là bốn vai trò được gọi tuần tự, không nhất thiết là bốn mô hình độc lập hay bốn bot chạy song song. Seeker khoanh đúng phạm vi. Weaver làm rõ từng công đoạn. Verifier kiểm tra cấu trúc đó với văn bản gốc. Architect nhận cấu trúc đã kiểm tra để lập lịch. Phân vai giúp giảm khối lượng suy luận của mỗi lượt gọi.", "source": "Mục 4.3.1, Hình 5", "page": 7}, {"title": "Seeker và Weaver: trích xuất đúng công việc", "body": "<div class=\"cols\"><section><h3>Seeker · không bỏ sót nhiệm vụ</h3><blockquote>Sản phẩm A và B</blockquote><p>Ghi nhận đúng số lượng và từng nhiệm vụ phải hoàn thành.</p></section><section><h3>Weaver · làm rõ từng công đoạn</h3><table><thead><tr><th>Việc</th><th>Bước 1</th><th>Bước 2</th></tr></thead><tbody><tr><td>A</td><td>Cắt · 3 phút</td><td>Sơn · 2 phút</td></tr><tr><td>B</td><td>Cắt · 2 phút</td><td>Sơn · 4 phút</td></tr></tbody></table></section></div>", "note": "Seeker chỉ tập trung xác định nhiệm vụ, tránh bị phân tán bởi các chi tiết máy và thời gian. Weaver tiếp tục bóc tách mỗi nhiệm vụ thành các bước. Ví dụ A cần cắt ba phút rồi sơn hai phút; B cần cắt hai phút rồi sơn bốn phút. Bảng này là dữ liệu có cấu trúc, chưa phải lịch vì chưa có thời điểm bắt đầu.", "source": "Mục 4.3.1; ví dụ do nhóm xây dựng", "page": 7}, {"title": "Verifier: kiểm tra trước khi lập lịch", "body": "<div class=\"split\"><div><p class=\"big\">Văn bản gốc là căn cứ kiểm tra.</p><ul><li>Đã đủ nhiệm vụ và số lần thực hiện?</li><li>Đã đủ bước và đúng thứ tự?</li><li>Máy và thời lượng có khớp mô tả?</li></ul></div><div class=\"audit\"><span>DỮ LIỆU BỊ SAI</span><h3>B · Sơn · 3 phút</h3><div class=\"arrow\">↓ đối chiếu yêu cầu ↓</div><span>DỮ LIỆU ĐÃ SỬA</span><h3>B · Sơn · 4 phút</h3></div></div>", "note": "Verifier không đơn giản là hỏi mô hình có chắc không. Vai trò này phải đối chiếu từng trường với đầu vào gốc. Ví dụ nếu Weaver đọc nhầm thời gian sơn B thành ba phút, Verifier cần sửa thành bốn. Đây là kiểm tra ngữ nghĩa bằng LLM, vẫn có thể sai. Sau khi Architect lập lịch, ta còn cần kiểm tra ràng buộc bằng chương trình.", "source": "Mục 4.3.1; lỗi giả định để minh họa", "page": 7}, {"title": "Architect: chọn thứ tự sử dụng tài nguyên", "body": "<p>Hai phương án đều đúng ràng buộc, nhưng thời gian hoàn thành khác nhau.</p><div id=\"example-gantts\"></div><div class=\"wide\">Ưu tiên B trên máy cắt giúp máy sơn xử lý công đoạn dài sớm hơn.</div>", "note": "Nếu làm A trước, máy cắt làm A từ 0 đến 3 rồi B từ 3 đến 5; máy sơn làm A từ 3 đến 5 rồi B từ 5 đến 9. Nếu B trước, B được sơn từ 2 đến 6, trong lúc A được cắt từ 2 đến 5; sau đó sơn A từ 6 đến 8. Makespan giảm từ chín xuống tám phút. Đây là ví dụ tính tay của nhóm, không phải số liệu thực nghiệm trong bài.", "source": "Ví dụ tính toán của nhóm; nguyên lý theo mục 3, 4.3.1", "page": 7}, {"title": "Nguồn dữ liệu, cách tạo bài toán và mục đích đánh giá", "body": "<div class=\"flow\" style=\"gap:36px;margin-top:16px\"><section><b>01 · Thu thập nguồn</b><p style=\"font-size:24px\"><strong>135 nhiệm vụ cơ bản</strong> từ sách kỹ thuật, website Toyota / DMG MORI và trò chơi mô phỏng.</p><p style=\"font-size:22px\">Bốn lĩnh vực: sản xuất, xây dựng, dược phẩm và nấu ăn.</p></section><section><b>02 · Ghép bài toán</b><p style=\"font-size:24px\">Mỗi bài ghép <strong>5–10 nhiệm vụ dùng chung máy</strong> để tạo xung đột cần giải quyết.</p><p style=\"font-size:22px\">4 lĩnh vực × 6 cỡ bài × 10 bài<br>= <strong>240 bài toán</strong>.</p></section><section><b>03 · Tạo đề và đáp án</b><p style=\"font-size:24px\">Mẫu câu + GPT-4 tạo <strong>mô tả bằng văn bản</strong>.</p><p style=\"font-size:24px\">OR-Tools tính <strong>lịch tối ưu tham chiếu</strong> để đối chiếu.</p></section></div><div class=\"wide\" style=\"margin-top:38px\"><b>Mục đích: kiểm tra LLM có lập lịch đúng từ mô tả hay không</b><p style=\"font-size:24px;margin-top:10px\">Cho LLM đọc đề → sinh lịch → kiểm tra đủ công đoạn, đúng ràng buộc và độ lệch so với lịch chuẩn.</p></div>", "note": "Tác giả cần bộ bài toán có cả mô tả tự nhiên và đáp án để kiểm tra LLM có lập lịch đúng hay không. Vì dữ liệu dự án công nghiệp đầy đủ thường khó tiếp cận, họ tổng hợp và đối chiếu nhiều nguồn công khai. Phụ lục A.1, Bảng 6 liệt kê sách như Fundamentals of Modern Manufacturing và Automotive Handbook, website Toyota, DMG MORI, cùng các trò chơi mô phỏng Construction Simulator, Big Pharma và Overcooked 2. Từ các nguồn này, tác giả xây dựng 135 nhiệm vụ cơ bản: 28 về sản xuất, 29 về xây dựng, 32 về dược phẩm và 46 về nấu ăn. Một nhiệm vụ gồm nhiều công đoạn, mỗi công đoạn có máy cần dùng, thời lượng và thứ tự thực hiện. Sau đó, tác giả nhóm các nhiệm vụ có dùng chung máy thành 13 nhóm, để khi ghép bài toán sẽ xuất hiện cạnh tranh tài nguyên. Trong từng nhóm, họ lấy từ năm đến mười nhiệm vụ để tạo một bài toán lập lịch. Có bốn lĩnh vực, sáu cỡ bài toán từ năm đến mười nhiệm vụ, và mười bài cho mỗi tổ hợp lĩnh vực với cỡ bài, nên tổng là bốn nhân sáu nhân mười bằng 240. Tác giả dùng mẫu câu rồi GPT-4 để tạo và làm mượt mô tả ngôn ngữ tự nhiên từ cấu trúc công việc. OR-Tools tạo lịch tối ưu tham chiếu. Vì thế mỗi bài có ba phần: mô tả bằng văn bản, cấu trúc công đoạn đúng và lịch tham chiếu. Khi đánh giá, LLM nhận mô tả văn bản để sinh lịch; tác giả đối chiếu đầu ra với cấu trúc công việc và lịch tham chiếu để đo việc thực hiện đúng công đoạn, tính khả thi và chất lượng thời gian hoàn thành. Bộ này phục vụ đánh giá và so sánh các phương pháp trong nghiên cứu; không phải 240 dự án công nghiệp thu thập nguyên trạng.", "source": "Mục 3, Bảng 1; phụ lục A.1–A.3, Bảng 6. Dữ liệu tổng hợp, không phải 240 dự án thực tế.", "page": 12}, {"title": "Đo lịch đúng ở ba mức: bước, nhiệm vụ và toàn bộ lịch", "body": "<div class=\"rows\"><section style=\"padding:22px 0\"><b style=\"min-width:90px\">SER</b><div><h3 style=\"font-size:27px\">Tỷ lệ công đoạn thực hiện đúng</h3><p style=\"font-size:24px;line-height:1.5\">Xét từng bước trong một nhiệm vụ, rồi lấy trung bình qua các nhiệm vụ và lịch.<br>Ví dụ: một nhiệm vụ có 4 bước, làm đúng 3 bước → 75%.</p></div></section><section style=\"padding:22px 0\"><b style=\"min-width:90px\">TCR</b><div><h3 style=\"font-size:27px\">Tỷ lệ nhiệm vụ hoàn thành đầy đủ</h3><p style=\"font-size:24px;line-height:1.5\">Một nhiệm vụ chỉ hoàn thành khi các công đoạn cần thiết đều thực hiện đúng.<br>Ví dụ: trong một lịch có 5 nhiệm vụ, hoàn thành 3 → 60%.</p></div></section><section style=\"padding:22px 0\"><b style=\"min-width:90px\">SFR</b><div><h3 style=\"font-size:27px\">Tỷ lệ lịch hoàn toàn hợp lệ</h3><p style=\"font-size:24px;line-height:1.5\">Cả lịch phải đủ công việc và không vi phạm ràng buộc.<br>Ví dụ: tạo 20 lịch, có 8 lịch hợp lệ → SFR = 40%.</p></div></section></div><div class=\"wide\" style=\"font-size:24px;margin-top:25px\">SER hoặc TCR cao chưa có nghĩa là dùng được cả lịch. Chỉ một xung đột cũng có thể khiến lịch không đạt SFR.</div>", "note": "Ba chỉ số tương ứng với ba mức kiểm tra khác nhau. SER, Overall Steps Execution Rate, đo phần công đoạn được thực hiện đúng, lấy trung bình theo nhiệm vụ rồi theo các lịch; không mặc nhiên tính bằng tổng bước đúng chia tổng bước của mọi bài. TCR, Average Task Completion Rate, đo tỷ lệ nhiệm vụ hoàn thành trọn vẹn, lấy trung bình theo lịch. SFR, Schedule Feasibility Rate, đo tỷ lệ các lịch hoàn toàn khả thi trong số lịch được sinh. Ba ví dụ trên là ví dụ độc lập để hiểu cách đọc chỉ số, không phải số liệu thí nghiệm. Một lịch vẫn có thể hoàn thành vài nhiệm vụ nhưng không đạt điều kiện toàn bộ lịch. Vì thế khi đánh giá ứng dụng thực tế phải nhìn SFR thay vì chỉ nhìn mức thực hiện đúng từng phần.", "source": "Mục 4.1.2, công thức 1–3; ví dụ minh họa cách đọc chỉ số", "page": 5}, {"title": "Có bao nhiêu lịch được tạo ra hoàn toàn hợp lệ?", "body": "<p style=\"font-size:24px;line-height:1.5\"><b>SFR = số lịch hoàn toàn hợp lệ / tổng số lịch được tạo.</b><br>Ở đây mỗi bài có 5 nhiệm vụ, mỗi nhiệm vụ gồm nhiều công đoạn.</p><div class=\"bars\" style=\"margin:20px 0\"><div style=\"grid-template-columns:430px 1fr 100px;margin:22px 0\"><span style=\"font-size:23px\">GPT-4.1 · trả lời trực tiếp</span><div class=\"track\"><i style=\"width:5%\"></i></div><b>5%</b></div><div style=\"grid-template-columns:430px 1fr 100px;margin:22px 0\"><span style=\"font-size:23px\">Gemini 2.5 Flash · trực tiếp</span><div class=\"track\"><i style=\"width:20%\"></i></div><b>20%</b></div><div style=\"grid-template-columns:430px 1fr 100px;margin:22px 0\"><span style=\"font-size:23px\">o4-mini · trả lời trực tiếp</span><div class=\"track\"><i style=\"width:32.5%\"></i></div><b>32.5%</b></div><div style=\"grid-template-columns:430px 1fr 100px;margin:22px 0\"><span style=\"font-size:23px\">Gemini 2.5 Pro · trực tiếp</span><div class=\"track\"><i style=\"width:32.5%\"></i></div><b>32.5%</b></div><div style=\"grid-template-columns:430px 1fr 100px;margin:22px 0\"><span style=\"font-size:23px\">MANS · dùng Gemini 2.5 Flash</span><div class=\"track\"><i style=\"width:40%\"></i></div><b>40%</b></div></div><div class=\"wide\" style=\"font-size:24px;margin-top:25px\">Cùng mô hình nền Gemini 2.5 Flash: trả lời trực tiếp đạt <b>20%</b>, MANS đạt <b>40%</b>.<br>40% là tỷ lệ lịch hợp lệ, không phải mức đúng của từng công đoạn.</div>", "note": "Biểu đồ dùng cùng thước đo SFR đã được định nghĩa trước. Bốn hàng mô hình trả lời trực tiếp lấy từ Bảng 2, nhóm bài có năm nhiệm vụ. Hàng MANS lấy từ Bảng 3, cùng quy mô năm nhiệm vụ và dùng Gemini 2.5 Flash không thinking làm mô hình nền. Cặp so sánh phù hợp nhất ở đây là Flash trực tiếp hai mươi phần trăm với MANS bốn mươi phần trăm, vì giữ cùng mô hình nền. Các mô hình khác cho bối cảnh tham khảo, không phải kiểm soát hết mọi yếu tố so sánh. MANS cải thiện tỷ lệ lịch hợp lệ, nhưng bốn mươi phần trăm cũng có nghĩa sáu mươi phần trăm lịch chưa đạt điều kiện toàn bộ. Kết quả này không chứng minh hệ thống sẵn sàng tự động lập lịch trong thực tế.", "source": "Bảng 2 và 3, nhóm #Task=5; MANS dùng Gemini 2.5 Flash không thinking", "page": 7}, {"title": "Phân biệt thời gian sinh lịch và thời gian làm công việc", "body": "<table style=\"width:100%;table-layout:fixed;border-collapse:collapse;margin-top:24px\"><thead><tr><th style=\"width:23%;text-align:left;padding:18px 20px;font-size:22px;line-height:1.4;vertical-align:middle\">Khái niệm</th><th style=\"width:39%;text-align:left;padding:18px 20px;font-size:22px;line-height:1.4;vertical-align:middle\">Đo điều gì?</th><th style=\"width:38%;text-align:left;padding:18px 20px;font-size:22px;line-height:1.4;vertical-align:middle\">Ví dụ minh họa</th></tr></thead><tbody><tr style=\"color:#142b43;font-weight:400\"><td style=\"width:23%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\"><b>WRT</b><br><span style=\"font-size:20px\">Thời gian chạy lâu nhất</span></td><td style=\"width:39%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">Thời gian lâu nhất máy tính mất để <b>sinh ra lịch</b>, trong tập thử nghiệm.</td><td style=\"width:38%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">Lần chạy chậm nhất mất 80 giây<br>→ WRT = 80 giây.</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"width:23%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\"><b>Makespan</b><br><span style=\"font-size:20px\">Thời gian hoàn tất lịch</span></td><td style=\"width:39%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">Thời gian từ mốc bắt đầu đến khi <b>công đoạn cuối cùng kết thúc</b>.</td><td style=\"width:38%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">Hai lịch hợp lệ dài 8 và 9 phút<br>→ lịch 8 phút hoàn thành sớm hơn.</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"width:23%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\"><b>RMD</b><br><span style=\"font-size:20px\">Độ lệch thời gian</span></td><td style=\"width:39%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">Mức lệch tương đối của makespan so với lịch tối ưu, lấy trung bình trên các lịch khả thi.</td><td style=\"width:38%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">Chuẩn 10 phút; lịch sinh ra 11 phút<br>→ lệch 10%.</td></tr></tbody></table><div class=\"wide\" style=\"font-size:24px;margin-top:25px\"><b>WRT:</b> đo thời gian tính toán. <b>Makespan / RMD:</b> đo thời gian thực hiện công việc.<br>WRT và RMD thấp hơn là tốt hơn; RMD = 0% nghĩa là khớp thời gian tối ưu.</div>", "note": "Cần tách hai đồng hồ. WRT là thời gian máy tính chạy để tạo câu trả lời, lấy trường hợp lâu nhất trong thiết lập thí nghiệm; nó không phải thời gian trung bình và không phải thời gian các công việc diễn ra. Makespan là độ dài kế hoạch: thời điểm công đoạn cuối cùng hoàn tất tính từ mốc không. RMD đo mức makespan lệch tương đối so với tham chiếu, rồi lấy trung bình. Ví dụ tham chiếu mười phút, lịch hợp lệ mười một phút, độ lệch là một phần mười tức mười phần trăm. Chỉ số RMD được dùng để đánh giá chất lượng thời gian của những lịch đã khả thi; nó không thay thế việc xem SFR. Hai ví dụ số trên để giải thích khái niệm, không phải số liệu trong Bảng 4.", "source": "Mục 3, 4.3.1 và Bảng 4; ví dụ minh họa đơn vị và độ lệch", "page": 8}, {"title": "Đánh đổi: sinh lịch nhanh hơn, nhưng lịch chưa ngắn bằng", "body": "<p style=\"font-size:24px;line-height:1.5\">CoE / Optimus: LLM sinh mô hình, mã để gọi OR-Tools.<br>MANS: các vai trò LLM trực tiếp suy luận lịch.</p><table style=\"width:100%;table-layout:fixed;border-collapse:collapse;margin-top:24px\"><thead><tr><th style=\"width:40%;text-align:left;padding:18px 20px;font-size:22px;line-height:1.4;vertical-align:middle\">Phương pháp</th><th style=\"width:30%;text-align:center;padding:18px 20px;font-size:22px;line-height:1.4;vertical-align:middle\">WRT<br><span style=\"font-size:19px;font-weight:400\">Lần chạy lâu nhất · giây</span></th><th style=\"width:30%;text-align:center;padding:18px 20px;font-size:22px;line-height:1.4;vertical-align:middle\">RMD<br><span style=\"font-size:19px;font-weight:400\">Độ lệch thời gian · %</span></th></tr></thead><tbody><tr style=\"color:#142b43;font-weight:400\"><td style=\"width:40%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">CoE + OR-Tools</td><td style=\"width:30%;text-align:center;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">154.44</td><td style=\"width:30%;text-align:center;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">2.3%</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"width:40%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">Optimus + OR-Tools</td><td style=\"width:30%;text-align:center;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">133.70</td><td style=\"width:30%;text-align:center;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">2.2%</td></tr><tr style=\"color:#087f83;font-weight:650\"><td style=\"width:40%;text-align:left;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">MANS</td><td style=\"width:30%;text-align:center;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">79.59</td><td style=\"width:30%;text-align:center;padding:21px 20px;font-size:24px;line-height:1.5;vertical-align:middle;font-variant-numeric:tabular-nums\">8.5%</td></tr></tbody></table><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:30px\"><section><h3 style=\"font-size:25px;color:#087f83;margin-bottom:12px\">MANS giảm thời gian chờ sinh lịch</h3><p style=\"font-size:24px;line-height:1.5\">WRT 79.59 giây so với 133.70 giây:<br>thấp hơn khoảng 40,5%.</p></section><section style=\"border-left:1px solid #dce4e9;padding-left:35px\"><h3 style=\"font-size:25px;margin-bottom:12px\">Optimus tạo lịch gần tối ưu hơn</h3><p style=\"font-size:24px;line-height:1.5\">RMD 2.2% thấp hơn 8.5% của MANS,<br>trên các lịch khả thi được đánh giá.</p></section></div>", "note": "Bảng này tách hai mặt thay vì nói chung MANS tốt hơn. Các giá trị RMD gốc là 0,023, 0,022 và 0,085, được đổi thành phần trăm để dễ đọc. WRT của MANS là 79,59 giây, thấp hơn 133,70 giây của Optimus cộng OR-Tools khoảng 40,5 phần trăm. Đây là so sánh thời gian chạy lâu nhất, không kết luận mọi lần chạy hay thời gian trung bình đều nhanh hơn từng ấy. Ở mặt chất lượng lịch khả thi, RMD của MANS là tám phẩy năm phần trăm, cao hơn hai phẩy hai phần trăm của Optimus cộng OR-Tools. Vì vậy lịch MANS xa thời gian tối ưu hơn theo chỉ số báo cáo này. RMD được tính trên lịch khả thi của từng phương pháp; không dùng nó để bỏ qua khác biệt SFR hoặc tuyên bố một phương pháp thắng ở mọi bài. Hai hệ CoE, Chain of Experts, và Optimus là các baseline LLM kết hợp solver trong bài.", "source": "Bảng 4; RMD đổi từ số thập phân sang %; phần trăm WRT tính từ số gốc", "page": 8}, {"title": "Bỏ từng vai trò để kiểm tra chúng có thực sự hữu ích", "body": "<p style=\"font-size:24px;line-height:1.5\">Giữ cùng mô hình nền và bài toán 5 nhiệm vụ; chỉ bỏ một vai trò mỗi lần.<br>Đo lại <b>SFR — tỷ lệ lịch hoàn toàn hợp lệ</b>.</p><div style=\"margin-top:25px\"><table style=\"font-size:23px;table-layout:fixed\"><thead><tr><th style=\"font-size:21px;width:25%;\">Cấu hình</th><th style=\"font-size:21px;width:52%;\">Phần xử lý bị bỏ</th><th style=\"font-size:21px;width:23%;\">Lịch hoàn toàn hợp lệ</th></tr></thead><tbody><tr style=\"color:#087f83;font-weight:650\"><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">MANS đầy đủ</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Giữ đủ bốn vai trò</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">40%</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Bỏ Seeker</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Không có bước chuyên nhận diện nhiệm vụ</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">20%</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Bỏ Weaver</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Không có bước chuyên bóc tách công đoạn</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">37.5%</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Bỏ Verifier</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Không có bước chuyên đối chiếu và sửa dữ liệu</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">30%</td></tr></tbody></table></div><div class=\"wide\" style=\"font-size:24px;margin-top:25px\">Đây là phép thử <b>bỏ từng thành phần</b>, không phải so sánh bốn LLM khác nhau.<br>Bỏ Seeker làm tỷ lệ lịch hợp lệ giảm mạnh nhất trong nhóm này.</div>", "note": "Thí nghiệm này được gọi là ablation study, tức bỏ một thành phần để kiểm tra phần đó có đóng góp hay không. Ta giữ cùng thiết lập và quy mô năm nhiệm vụ. Bản đầy đủ tạo được bốn mươi phần trăm lịch hợp lệ. Bỏ Seeker còn hai mươi, bỏ Weaver còn ba mươi bảy phẩy năm, bỏ Verifier còn ba mươi. Do đó dữ liệu ủng hộ việc chia vai trò, đặc biệt là nhận diện đúng phạm vi công việc. Không cộng các tỷ lệ giảm với nhau, vì mỗi hàng là một cấu hình thử riêng. Kết quả cho thấy ích lợi tương đối của các vai trò, không chứng minh bản đầy đủ luôn đúng.", "source": "Mục 4.3.2, Bảng 5, nhóm #Task=5", "page": 8}, {"title": "Nghiên cứu đã làm được gì và còn thiếu bằng chứng nào?", "body": "<table style=\"font-size:23px;table-layout:fixed\"><thead><tr><th style=\"font-size:21px;width:50%;\">Đóng góp có trong bài</th><th style=\"font-size:21px;width:50%;\">Giới hạn cần hiểu đúng</th></tr></thead><tbody><tr style=\"color:#142b43;font-weight:400\"><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\"><b>Bộ đánh giá có đáp án đối chiếu</b><br>240 bài có mô tả văn bản, cấu trúc công việc và lịch tham chiếu.</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">Dữ liệu bán tổng hợp, mỗi bài 5–10 nhiệm vụ. Chưa chứng minh hiệu quả trên dự án công nghiệp quy mô lớn.</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\"><b>MANS được cài đặt và thử nghiệm</b><br>Có bốn vai trò, mã Python công khai và so sánh với các phương pháp khác.</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">SFR ở nhóm 5 nhiệm vụ là 40%; không bảo đảm mọi lịch đầu ra đều sử dụng được.</td></tr><tr style=\"color:#142b43;font-weight:400\"><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\"><b>Có cải thiện trong một số mặt</b><br>WRT thấp hơn các cấu hình LLM + solver trong Bảng 4.</td><td style=\"font-size:23px;padding:16px;line-height:1.45;text-align:left\">RMD chưa tốt nhất; chưa xét thời lượng ngẫu nhiên, máy hỏng hoặc tài nguyên thay đổi theo thời gian.</td></tr></tbody></table><div class=\"wide\" style=\"font-size:24px;margin-top:25px\">Có nguyên mẫu và kết quả thực nghiệm ≠ đã đủ bằng chứng để vận hành tự động trong thực tế.</div>", "note": "Bài này không chỉ là một bài nêu tầm nhìn: tác giả đã xây bộ đánh giá, triển khai MANS và thực hiện thí nghiệm. Tuy vậy, có thực nghiệm không đồng nghĩa đã đạt độ tin cậy để vận hành. Cần đọc cùng lúc tỷ lệ lịch hợp lệ, độ lệch thời gian, tốc độ và phạm vi dữ liệu. Các giới hạn dữ liệu bán tổng hợp, số nhiệm vụ nhỏ, thời lượng bất định và tài nguyên động đều được bài thừa nhận. Nghiên cứu có giá trị như một phương pháp và bộ đánh giá cho bài toán mới, nhưng không phải bằng chứng rằng hệ thống có thể tự động ra quyết định lập lịch mà không kiểm tra. Việc có mã công khai cũng không tự chứng minh mọi người đều tái lập được toàn bộ kết quả.", "source": "Mục 3–6, Bảng 3–5; liên kết mã nguồn ở trang đầu", "page": 9}, {"title": "Áp dụng vào lập kế hoạch: đề xuất lịch và kiểm tra trước khi dùng", "body": "<div class=\"flow\"><section><b>Mô tả rõ công việc</b><p>Nhiệm vụ, thời lượng, tài nguyên và phụ thuộc</p></section><section><b>MANS đề xuất lịch</b><p>Phân vai để hiểu yêu cầu và sắp xếp thời gian</p></section><section><b>Kiểm tra bằng chương trình</b><p>Đủ bước, đúng thứ tự, đúng thời lượng, không trùng máy</p></section><section><b>Người quản lý xem xét</b><p>Chấp nhận lịch đạt điều kiện hoặc yêu cầu làm lại</p></section></div><div class=\"wide\" style=\"font-size:24px;margin-top:25px\">Giá trị áp dụng: hỗ trợ tạo phương án từ yêu cầu bằng lời.<br>Lịch không đạt kiểm tra cần được sửa hoặc từ chối, không tự đưa vào thực hiện.</div>", "note": "Đây là cách nhóm diễn giải khả năng áp dụng, không phải một vòng kiểm tra bên ngoài đã được tác giả chứng minh trong MANS nguyên bản. Hệ thống có thể hỗ trợ biến yêu cầu thành phương án, nhưng trước khi dùng cần chương trình kiểm tra ràng buộc và người quản lý xem xét. Bộ kiểm tra cũng chỉ có ý nghĩa khi cấu trúc công việc đối chiếu là đúng; nếu đọc sai yêu cầu từ đầu thì cần kiểm tra lại với văn bản gốc. Phạm vi này phù hợp một trợ lý lập kế hoạch có giám sát. Không gọi đây là giải pháp tự động hoàn chỉnh hay hệ thống phân tích rủi ro toàn diện.", "source": "Hướng áp dụng của nhóm dựa trên kết quả và giới hạn mục 4–6", "page": 9}, {"title": "Kết luận: MANS cải thiện cách lập lịch, chưa bảo đảm mọi đầu ra", "body": "<div class=\"rows\"><section style=\"padding:22px 0\"><b style=\"min-width:90px\">RQ1</b><div><h3 style=\"font-size:27px\">LLM có thể sinh lịch từ văn bản, nhưng còn nhiều lịch không hợp lệ</h3><p style=\"font-size:24px;line-height:1.5\">Cần đo tính khả thi của cả lịch, không chỉ xem câu trả lời có vẻ hợp lý.</p></div></section><section style=\"padding:22px 0\"><b style=\"min-width:90px\">RQ2</b><div><h3 style=\"font-size:27px\">Điểm khó là giữ đúng công đoạn và các ràng buộc cùng lúc</h3><p style=\"font-size:24px;line-height:1.5\">Bỏ sót một nhiệm vụ hoặc xếp trùng máy có thể làm cả lịch không dùng được.</p></div></section><section style=\"padding:22px 0\"><b style=\"min-width:90px\">RQ3</b><div><h3 style=\"font-size:27px\">Phân vai có ích trong thiết lập thí nghiệm được báo cáo</h3><p style=\"font-size:24px;line-height:1.5\">MANS cải thiện SFR so với cùng mô hình nền trả lời trực tiếp, có WRT thấp hơn; RMD chưa tốt nhất.</p></div></section></div><div class=\"wide\" style=\"font-size:24px;margin-top:25px\">Đóng góp: bộ bài toán đánh giá + phương pháp bốn vai trò + bằng chứng thực nghiệm.<br>Chưa chứng minh: khả năng lập lịch tự động đủ tin cậy trong điều kiện thực tế.</div>", "note": "Kết luận cần giữ đúng mức bằng chứng. MANS là phương pháp đã triển khai và đánh giá, không chỉ một ý tưởng. Trong thiết lập được báo cáo, chia vai trò giúp cải thiện một số chỉ số và giảm thời gian chạy lâu nhất so với các cấu hình LLM cộng solver được so sánh. Nhưng SFR vẫn thấp và chất lượng thời gian của lịch khả thi chưa tốt nhất. Vì thế nghiên cứu không chứng minh rằng MANS đủ tin cậy để dùng tự động trong vận hành thực tế. Điểm học được là cách đặt bài toán từ văn bản tới lịch, xây chuẩn đánh giá và kiểm tra tác dụng của từng vai trò. Nếu mục tiêu triển khai đòi hỏi mọi lịch đều đúng mà không cần kiểm tra, kết quả của bài hiện chưa đáp ứng tiêu chí đó.", "source": "Mục 4–6; Bảng 2–5", "page": 9}];let current=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));const stage=document.querySelector('#stage');function inner(s,i){return `<header><h2>${s.title}</h2></header><main>${s.body}</main><footer><a href="https://aclanthology.org/2026.acl-long.1648.pdf#page=${s.page}" target="_blank" rel="noopener">Nguồn: Liao và cộng sự, ACL 2026 · ${s.source}</a><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></footer>`}function gantt(order){let rows=order===0?[[['A',0,3],['B',3,5]],[['A',3,5],['B',5,9]]]:[[['B',0,2],['A',2,5]],[['B',2,6],['A',6,8]]];return `<div class="gantt-title">${order===0?'A trước · 9 phút':'B trước · 8 phút'}</div>`+rows.map((r,i)=>`<div class="gantt-row"><span>Máy ${i?'sơn':'cắt'}</span><div class="timeline">${r.map(([t,s,e])=>`<div class="block ${t==='B'?'b':''}" style="left:${s/9*100}%;width:${(e-s)/9*100}%">${t} · ${s}–${e}</div>`).join('')}</div></div>`).join('')}function fillGantts(){document.querySelectorAll('#example-gantts').forEach(e=>e.innerHTML=gantt(0)+gantt(1))}function render(){stage.className=current===0?'cover':'';stage.innerHTML=inner(slides[current],current);document.querySelector('#notes').textContent=slides[current].note;history.replaceState(null,'','#'+(current+1));fillGantts()}function go(n){current=Math.max(0,Math.min(slides.length-1,n));render()}function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1440,innerHeight/900))}let digits='';document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[0-9]$/.test(e.key)){digits+=e.key;return}if(e.key==='Enter'&&digits){go(Number(digits)-1);digits='';return}digits='';if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='n')document.querySelector('#notes').classList.toggle('open');if(e.key.toLowerCase()==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));window.addEventListener('resize',resize);window.addEventListener('beforeprint',()=>{document.querySelector('#print').innerHTML=slides.map((s,i)=>`<article class="print-slide ${i===0?'cover':''}">${inner(s,i)}</article>`).join('');stage.style.display='none';fillGantts()});window.addEventListener('afterprint',()=>{stage.style.display='';document.querySelector('#print').innerHTML=''});resize();render();</script><script>
(()=>{let digits='',timer;function count(){return typeof slides!=='undefined'?slides.length:0}function index(){return Math.max(0,(parseInt(location.hash.slice(1))||1)-1)}function move(n){n=Math.max(0,Math.min(count()-1,n));if(typeof go==='function')go(n);else if(typeof jumpTo==='function')jumpTo(n+1);else location.hash=n+1}function clear(){digits='';clearTimeout(timer)}window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable=true]'))return;let k=e.key;let used=true;if(/^[0-9]$/.test(k)){digits+=k;clearTimeout(timer);timer=setTimeout(clear,4000)}else if(k==='Enter'&&digits){let target=Number(digits)-1;clear();if(target>=0&&target<count())move(target)}else if(['ArrowRight','PageDown',' ','Spacebar','Space','Enter'].includes(k)){clear();if(k==='Enter'&&e.target.closest('a,button'))return;move(index()+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(k)){clear();move(index()-1)}else if(k==='Home'){clear();move(0)}else if(k==='End'){clear();move(count()-1)}else if(k.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{})}else if(k.toLowerCase()==='n'&&document.querySelector('#notes')){document.querySelector('#notes').classList.toggle('open')}else if(k==='Escape'){clear();document.querySelector('#notes')?.classList.remove('open')}else used=false;if(used){e.preventDefault();e.stopImmediatePropagation()}},true);document.addEventListener('click',e=>{if(e.target.closest('a,button,input,textarea,select,summary,details,#notes'))return;if(window.getSelection()?.toString())return;document.activeElement?.blur();window.focus();e.preventDefault();e.stopImmediatePropagation();move(index()+(e.clientX<innerWidth*.22?-1:1))},true);let startX;window.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});window.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>80)move(index()+(dx<0?1:-1))},{passive:true});document.body.tabIndex=-1;document.body.focus({preventScroll:true});window.focus()})();
</script></html>
